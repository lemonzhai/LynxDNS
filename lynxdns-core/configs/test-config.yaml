  listen_addr: "127.0.0.1"
  listen_port: 15353

api:
  addr: "127.0.0.1"
  port: 19090
  secret: "test-secret-123"

dns:
  domestic:
    - "udp://223.5.5.5:53"
    - "udp://119.29.29.29:53"
  remote:
    - "udp://8.8.8.8:53"
    - "udp://1.1.1.1:53"
